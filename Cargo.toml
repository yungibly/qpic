[package]
name = "qpic"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "A terminal image viewer you zoom and pan with the mouse"
license = "MIT"
repository = "https://github.com/yungibly/qpic"
homepage = "https://github.com/yungibly/qpic"

[dependencies]
base64 = "0.22"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
libc = "0.2"
signal-hook = "0.3"

[profile.release]
strip = true
